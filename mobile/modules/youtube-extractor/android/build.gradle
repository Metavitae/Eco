plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.youtubeextractor'
version = '1.0.0'

android {
  namespace "expo.modules.youtubeextractor"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    multiDexEnabled true
  }
  compileOptions {
    // NewPipeExtractor's own network layer relies on java.time APIs that
    // only ship natively from API 26/33+ - core library desugaring backports
    // them so it still works down at this project's minSdk 24.
    coreLibraryDesugaringEnabled true
  }
}

repositories {
  maven { url 'https://jitpack.io' }
}

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.4'
  implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
